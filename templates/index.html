<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 2rem;
        }

        .balance-container {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 5px;
        }

        .balance {
            font-size: 2.5rem;
            font-weight: bold;
            color: #28a745;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .button-group {
            display: flex;
            gap: 1rem;
        }

        button {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .add-btn {
            background-color: #28a745;
            color: white;
        }

        .remove-btn {
            background-color: #dc3545;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            color: #dc3545;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        .currency-symbol {
            font-size: 2rem;
            margin-right: 0.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cash Tracker</h1>
        <div class="balance-container">
            <div>Current Balance</div>
            <div class="balance">
                <span class="currency-symbol">₹</span><span id="balance">0.00</span>
            </div>
        </div>
        <div class="input-group">
            <input type="number" id="amount" placeholder="Enter amount in rupees" step="0.01" min="0">
            <div class="button-group">
                <button class="add-btn" onclick="addCash()">Add Cash</button>
                <button class="remove-btn" onclick="removeCash()">Remove Cash</button>
            </div>
        </div>
        <div class="error" id="error"></div>
    </div>

    <script>
        function updateBalance() {
            fetch('/api/balance')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('balance').textContent = data.balance.toFixed(2);
                });
        }

        function handleTransaction(type) {
            const amountInput = document.getElementById('amount');
            const errorDiv = document.getElementById('error');
            const amount = parseFloat(amountInput.value);

            if (!amount || amount <= 0) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Please enter a valid amount';
                return;
            }

            fetch('/api/transaction', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    amount: amount,
                    type: type
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = data.error;
                } else {
                    errorDiv.style.display = 'none';
                    amountInput.value = '';
                    updateBalance();
                }
            });
        }

        function addCash() {
            handleTransaction('add');
        }

        function removeCash() {
            handleTransaction('remove');
        }

        // Update balance when page loads
        updateBalance();
    </script>
</body>
</html>
